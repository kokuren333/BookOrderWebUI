# LayoutSpec: geometry and writing flow. Edit this file after initial resolution.
schema: "bookorder/layout-spec@1"
id: "book-layout"
page_size: "A5"
orientation: "portrait"
writing_mode: "horizontal-tb"
text_direction: "ltr"
page:
  width_mm: 148.0
  height_mm: 210.0
  margin_top_mm: 20
  margin_bottom_mm: 20
  margin_inner_mm: 20
  margin_outer_mm: 17
  bleed_mm: 0
body:
  columns: 1
  gutter_mm: 6
  baseline_grid: "none"
  column_balance: "none"
  paragraph_flow: "continuous"
regions:
  header:
    enabled: true
  footer:
    enabled: true
  margin_notes:
    enabled: false
  chapter_opener:
    span: "full"
  full_width:
    enabled: true
  full_page:
    enabled: true
spans:
  figure: 1
  table: 1
  callout: 1
  quote: 1
  code: 1
  equation: 1
writing:
  horizontal:
    text_direction: "ltr"
  vertical:
    figure_orientation: "horizontal"
    table_orientation: "horizontal"
    caption_orientation: "horizontal"
vertical:
  enabled: false
  line_direction: "top-to-bottom"
  page_progression: "right-to-left"
  punctuation_policy: "locale"
  latin_rotation: "auto"
  numeral_policy: "auto"
  ruby_policy: "auto"
