# Genre template: practical / how-to books. Visual-first: steps, checklists and illustrations, very short
# paragraphs, light citation, a checklist closing each chapter.
genre: practical
multiply:
  devices.visuals_per_10k: 1.2
  devices.callouts_per_chapter: 1.3
  devices.case_studies_per_chapter: 1.0
  structure.paragraph_chars_max: 0.75
  scale.nonprose_share_target: 1.15
set:
  citations.style: minimal
  citations.inline_markers_per_page_max: 0.5
  citations.further_reading_per_chapter: {min: 0, target: 1, max: 3}
  structure.chapter_end: [checklist]
  art_direction.ornament_level: medium
