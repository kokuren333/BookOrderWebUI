summary: "供給資料は、固定長ベクトルの限界から生まれた注意機構、それを系列全体の相互参照に拡張したTransformer、学習手順とスケーリング則、その結論を修正した計算最適スケーリング、評価の注意点を扱う。資料間ではパラメータ数とデータ量の配分をめぐって結論が対立しており、実験条件の違いとして整理する必要がある。"
key_questions:
  - "注意機構はどのような問題を解決するために生まれたのか"
  - "スケール化内積注意はどのように計算され、なぜその形なのか"
  - "スケーリング則の結論はなぜ修正されたのか"
  - "モデルの性能をどのように評価し、何に注意すべきか"
reader_needs: "機械学習の基礎を知るエンジニアが、注意機構から大規模モデルの学習と評価までを一貫した流れで理解すること。"
