summary: "言語モデルの学習手順（ウォームアップ付き学習率スケジュール）と、2020年のスケーリング則、すなわち損失が規模・データ・計算量に対してべき乗則に従い、パラメータ数を優先すべきとした結論、および外挿の限界を説明する資料。"
key_claims:
  - text: "損失はパラメータ数・データ量・計算量に対してべき乗則に従う。"
  - text: "2020年の研究は、計算予算の増加時にはパラメータ数を優先すべきと結論づけた。"
  - text: "べき乗則の外挿には観測範囲の明示が必要である。"
concepts: [スケーリング則, ウォームアップ, べき乗則]
