summary: "2022年の研究が計算最適なスケーリングを再検討し、パラメータ数とデータ量を同程度に増やすべきと結論づけたこと、先行研究との対立の原因としての実験条件の差、実務的な含意とデータ量の制約をまとめた記事。"
key_claims:
  - text: "固定された計算予算では、パラメータ数とデータ量をほぼ同じ比率で増やすのが最適である。"
  - text: "先行研究との違いは学習率スケジュールなど実験条件の差で説明される。"
  - text: "高品質なデータの量には限りがある。"
concepts: [計算最適, スケーリング則, データ制約]
