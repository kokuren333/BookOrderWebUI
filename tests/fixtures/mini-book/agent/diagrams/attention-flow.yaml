  - {id: k, label: "鍵 K"}
  - {id: dot, label: "内積 QK^T"}
  - {id: scale, label: "√d_k で割る"}
  - {id: softmax, label: "ソフトマックスで正規化"}
  - {id: v, label: "値 V"}
